
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMV CAR LAW GROUP | Trusted Document Consulting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000a1e; }
        .tab-active { color: #3b82f6 !important; border-bottom: 4px solid #3b82f6 !important; }
        .hidden { display: none !important; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body>

    <main id="tab-verify" class="container mx-auto px-6 py-16 max-w-xl">
        <div class="glass-panel p-10 rounded-[3rem] shadow-2xl text-center">
            <h2 class="text-2xl font-black uppercase italic mb-8 text-gray-800">Secure <span class="text-blue-600">Authentication</span></h2>
            <form id="verify-form" class="space-y-4">
                <input type="text" id="v-name" placeholder="FULL LEGAL NAME" class="w-full p-4 bg-slate-100 border-2 rounded-xl font-bold uppercase outline-none" required>
                <input type="text" id="v-id" placeholder="FOLIO / ID NUMBER" class="w-full p-4 bg-slate-100 border-2 rounded-xl font-bold uppercase outline-none" required>
                <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-800">Authenticate Record</button>
            </form>
        </div>
    </main>

    <main id="tab-record" class="hidden container mx-auto px-6 py-16 max-w-4xl">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl">
            <h1 class="text-2xl font-black mb-6">CLIENT VERIFICATION RECORD</h1>
            <p><strong>Code:</strong> <span id="record-code"></span></p>
            <p><strong>Full Name:</strong> <span id="record-fullname"></span></p>
            <p><strong>Document Status:</strong> <span id="record-doc"></span></p>
            <div class="mt-6 flex gap-4">
                <button id="btn-restrictions" class="hidden bg-orange-600 text-white px-4 py-2 rounded">View Restrictions</button>
                <button id="btn-usps-restrictions" class="hidden bg-orange-600 text-white px-4 py-2 rounded">View USPS Restrictions</button>
            </div>
            <div id="restrictions-content" class="hidden mt-6 p-4 bg-orange-100">Contenido Médico...</div>
            <div id="usps-restrictions-content" class="hidden mt-6 p-4 bg-orange-200">Contenido USPS...</div>
        </div>
    </main>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        }

        document.getElementById('verify-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('v-name').value;
            const id_cliente = document.getElementById('v-id').value;

            try {
                const response = await fetch('/api/verificar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, id_cliente })
                });

                const result = await response.json();

                if (result.success) {
                    const data = result.datos;
                    document.getElementById('record-code').innerText = data.id_cliente;
                    document.getElementById('record-fullname').innerText = data.nombre;
                    document.getElementById('record-doc').innerText = data.documento;

                    // Lógica de botones
                    const btnMed = document.getElementById('btn-restrictions');
                    const btnUsps = document.getElementById('btn-usps-restrictions');
                    btnMed.classList.add('hidden');
                    btnUsps.classList.add('hidden');

                    if (data.tipo_restriccion === 'MED') {
                        btnMed.classList.remove('hidden');
                        btnMed.onclick = () => document.getElementById('restrictions-content').classList.toggle('hidden');
                    } else if (data.tipo_restriccion === 'USP') {
                        btnUsps.classList.remove('hidden');
                        btnUsps.onclick = () => document.getElementById('usps-restrictions-content').classList.toggle('hidden');
                    }

                    showTab('record');
                } else {
                    alert('Record not found.');
                }
            } catch (err) {
                console.error(err);
                alert('Connection error.');
            }
        });
    </script>
</body>
</html>
