<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DMV CAR LAW GROUP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* MANTENEMOS TUS ESTILOS ORIGINALES */
        body { background: linear-gradient(rgba(0,10,30,0.65), rgba(0,10,30,0.65)), url('https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1950&q=80') center/cover no-repeat fixed; min-height: 100vh; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="bg-blue-900 p-6 text-white text-center text-4xl font-black italic">DMV CAR LAW GROUP</header>

    <main id="tab-verify" class="max-w-lg mx-auto bg-white p-8 rounded-3xl mt-10">
        <form id="verify-form" class="space-y-4">
            <input type="text" id="v-id" placeholder="INGRESA CÓDIGO (ID)" class="w-full p-4 border rounded-xl" required>
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black">VERIFICAR</button>
        </form>
    </main>

    <main id="tab-record" class="hidden max-w-4xl mx-auto bg-white p-8 rounded-3xl mt-10">
        <div id="resultado-data">
            <h2 class="text-2xl font-bold">Datos del Cliente</h2>
            <img id="record-foto" src="" class="w-40 h-40 object-cover mt-4">
            <p><strong>Nombre:</strong> <span id="record-fullname"></span></p>
            <p><strong>Estado:</strong> <span id="record-state"></span></p>
            <p><strong>Dirección:</strong> <span id="record-address"></span></p>
            <p><strong>Estatus:</strong> <span id="record-doc"></span></p>
        </div>
    </main>

    <script>
        document.getElementById('verify-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id_cliente = document.getElementById('v-id').value;
            const res = await fetch('/api/verificar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_cliente })
            });
            const result = await res.json();

            if (result.success) {
                document.getElementById('record-fullname').innerText = result.datos.nombre;
                document.getElementById('record-state').innerText = result.datos.estado;
                document.getElementById('record-address').innerText = result.datos.direccion;
                document.getElementById('record-doc').innerText = result.datos.documento;
                document.getElementById('record-foto').src = '/fotos/' + result.datos.foto_url;
                
                document.getElementById('tab-verify').classList.add('hidden');
                document.getElementById('tab-record').classList.remove('hidden');
            } else {
                alert('No se encontró el registro.');
            }
        });
    </script>
</body>
</html>
