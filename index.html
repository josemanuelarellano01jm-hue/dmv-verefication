<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMV CAR LAW GROUP | Trusted Document Consulting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; min-height: 100vh;
            background: linear-gradient(rgba(0, 10, 30, 0.65), rgba(0, 10, 30, 0.65)), url('https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80') center/cover no-repeat fixed;
        }
        .tab-active { color: #3b82f6 !important; border-bottom: 4px solid #3b82f6 !important; font-weight: 900 !important; }
        .hidden { display: none !important; }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
        .glass-dark { background: rgba(0, 20, 50, 0.75); backdrop-filter: blur(12px); }
        .ok-table th { background: #f0f4f9; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #1f2937; }
        .ok-table td { font-size: 14px; font-weight: 600; border-bottom: 1px solid #e5e7eb; }
        .restrictions-card { background: #fff3e0; border-left: 6px solid #e67e22; }
        .total-amount { background: #e67e22; color: white; padding: 12px; border-radius: 16px; font-weight: 900; text-align: center; }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .client-photo { width: 180px; height: 220px; object-fit: contain; border: 3px solid white; border-radius: 8px; display: none; }
        .photo-placeholder { width: 180px; height: 220px; border: 3px dashed #cbd5e1; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 12px; font-weight: bold; background: #f1f5f9; }
    </style>
</head>
<body>

    <header class="glass-dark sticky top-0 z-50 shadow-md text-white">
        <div class="container mx-auto px-6 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-end gap-3 cursor-pointer" onclick="showTab('home')">
                <span class="text-4xl font-black italic text-white leading-none">DMV</span>
            </div>
            <nav id="nav-menu" class="flex space-x-4">
                <button onclick="showTab('home')" class="px-3 py-2 text-[10px] uppercase font-black tracking-widest text-white">Home</button>
                <button onclick="showTab('verify')" class="px-3 py-2 text-[10px] uppercase font-black tracking-widest text-blue-200">Verification</button>
            </nav>
        </div>
    </header>

    <div id="main-content-wrapper">
        <main id="tab-home" class="animate-fade p-10 text-white text-center">
            <h2 class="text-5xl font-black italic uppercase">Expert Solutions</h2>
            <button onclick="showTab('verify')" class="mt-6 bg-blue-600 px-12 py-5 rounded-full font-black uppercase">Verify My Record Now</button>
        </main>

        <main id="tab-verify" class="hidden animate-fade p-10 max-w-lg mx-auto bg-white rounded-3xl mt-10">
            <form id="verify-form" class="space-y-4">
                <input type="text" id="v-name" placeholder="FULL LEGAL NAME" class="w-full p-4 border rounded-xl" required>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black">AUTHENTICATE</button>
            </form>
        </main>

        <main id="tab-record" class="hidden animate-fade bg-white max-w-4xl mx-auto p-8 rounded-3xl mt-10">
            <table class="w-full text-left ok-table">
                <thead>
                    <tr><th>Code</th><th>Full Name</th><th>Document</th></tr>
                </thead>
                <tbody class="border-b">
                    <tr>
                        <td class="px-6 py-4" id="record-code">---</td>
                        <td class="px-6 py-4" id="record-fullname">---</td>
                        <td class="px-6 py-4" id="record-doc">---</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

    <footer class="bg-blue-900/90 text-blue-200 py-16 text-center mt-12">
        <p>&copy; 2026 DMV CAR LAW GROUP. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        }
        document.getElementById('verify-form').addEventListener('submit', function(e) {
            e.preventDefault();
            showTab('record');
        });
    </script>
</body>
</html>
