<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMV CAR LOW GROUP | Official Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .tab-active { color: #2563eb; border-bottom: 4px solid #2563eb; font-weight: 900; }
        .hidden { display: none; }
        .hero-bg { background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1000'); background-size: cover; background-position: center; }
        .data-label { font-size: 10px; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .data-value { font-size: 14px; color: #0f172a; font-weight: 900; text-transform: uppercase; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="bg-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg"><i class="fas fa-car-side text-xl"></i></div>
                <h1 class="text-xl font-black italic uppercase">DMV <span class="text-blue-600">CAR LOW GROUP</span></h1>
            </div>
            <nav class="flex space-x-6 mt-4 md:mt-0">
                <button onclick="showTab('home')" id="nav-home" class="px-3 py-2 text-[10px] uppercase font-black tracking-widest tab-active">Home</button>
                <button onclick="showTab('verify')" id="nav-verify" class="px-3 py-2 text-[10px] uppercase font-black tracking-widest text-slate-400">Verification</button>
            </nav>
        </div>
    </header>

    <main id="tab-home" class="">
        <section class="hero-bg text-white py-24 px-6 text-center">
            <h2 class="text-4xl md:text-6xl font-black mb-6 italic uppercase">Independent Legal <br> <span class="text-blue-500">Documentation</span></h2>
            <button onclick="showTab('verify')" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-full font-black uppercase tracking-widest transition shadow-lg">Verify Status</button>
        </section>
    </main>

    <main id="tab-verify" class="hidden container mx-auto px-6 py-10">
        <div class="max-w-2xl mx-auto space-y-8">
            
            <div class="bg-white p-8 rounded-[2rem] shadow-xl border-t-8 border-blue-600">
                <h2 class="text-xl font-black uppercase italic mb-6 text-center">Authentication <span class="text-blue-600">Center</span></h2>
                <form onsubmit="handleVerify(event)" class="space-y-4">
                    <input type="text" id="v-name" placeholder="FULL LEGAL NAME" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold uppercase text-xs focus:border-blue-600 outline-none" required>
                    <input type="text" id="v-id" placeholder="FOLIO / ID NUMBER" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold uppercase text-xs focus:border-blue-600 outline-none" required>
                    <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-800 transition shadow-lg">Authenticate Record</button>
                </form>
            </div>

            <div id="verify-result" class="hidden bg-white rounded-[2rem] shadow-2xl border-2 border-slate-100 overflow-hidden animate-fade">
                <div class="bg-blue-600 p-4 text-white text-center font-black uppercase text-[10px] tracking-widest">Official Record Found</div>
                
                <div class="p-8 flex flex-col md:flex-row gap-8 items-start">
                    <div class="w-full md:w-40 h-48 bg-slate-100 rounded-2xl overflow-hidden border-4 border-slate-50 shadow-md flex-shrink-0">
                        <img id="res-img" src="" class="w-full h-full object-cover">
                    </div>
                    
                    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2 border-b pb-2">
                            <p class="data-label">Full Legal Name</p>
                            <p id="res-name" class="text-xl font-black text-blue-700"></p>
                        </div>
                        <div>
                            <p class="data-label">Folio / ID</p>
                            <p id="res-id" class="data-value"></p>
                        </div>
                        <div>
                            <p class="data-label">License Type</p>
                            <p id="res-tipo" class="data-value"></p>
                        </div>
                        <div>
                            <p class="data-label">State</p>
                            <p id="res-estado" class="data-value"></p>
                        </div>
                        <div>
                            <p class="data-label">Email</p>
                            <p id="res-correo" class="data-value lowercase italic"></p>
                        </div>
                        <div class="md:col-span-2">
                            <p class="data-label">Physical Address</p>
                            <p id="res-direccion" class="data-value"></p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        function showTab(id) {
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active', 'text-slate-400'));
            document.getElementById('nav-' + id).classList.add('tab-active');
        }

        async function handleVerify(e) {
            e.preventDefault();
            const res = await fetch('/api/verificar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    nombre: document.getElementById('v-name').value, 
                    id_cliente: document.getElementById('v-id').value 
                })
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('res-name').textContent = data.datos.nombre;
                document.getElementById('res-id').textContent = data.datos.id_cliente;
                document.getElementById('res-tipo').textContent = data.datos.tipo_licencia;
                document.getElementById('res-estado').textContent = data.datos.estado;
                document.getElementById('res-correo').textContent = data.datos.correo;
                document.getElementById('res-direccion').textContent = data.datos.direccion;
                document.getElementById('res-img').src = data.datos.foto_url;
                document.getElementById('verify-result').classList.remove('hidden');
            } else {
                alert("RECORD NOT FOUND");
                document.getElementById('verify-result').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
