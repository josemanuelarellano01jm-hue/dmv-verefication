<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMV CAR LOW GROUP | Trusted Document Consulting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .tab-active { color: #2563eb; border-bottom: 4px solid #2563eb; font-weight: 900; }
        .hidden { display: none; }
        .hero-bg { background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&q=80&w=1500'); background-size: cover; background-position: center; }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .verify-seal {
            background: #16a34a;
            color: white;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
            border: 2px solid white;
        }

        /* Ajuste para que la foto se vea completa y adaptativa */
        .photo-container {
            width: 100%;
            max-width: 280px; /* Tamaño ideal para licencias */
            aspect-ratio: 3 / 2; /* Proporción estándar de documentos */
            background: #f1f5f9;
            border-radius: 1rem;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Esto asegura que la foto NO se corte */
            display: block;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="bg-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg shadow-lg"><i class="fas fa-shield-alt text-xl"></i></div>
                <h1 class="text-xl font-black italic uppercase tracking-tighter">DMV <span class="text-blue-600">CAR LOW GROUP</span></h1>
            </div>
            <nav class="flex space-x-2 md:space-x-6 mt-4 md:mt-0">
                <button onclick="showTab('home')" id="nav-home" class="px-3 py-2 text-[10px] uppercase font-black tracking-widest tab-active">Home</button>
                <button onclick="showTab('trust')" id="nav-trust" class="px-3 py-2 text-[10px] uppercase font-black tracking-widest text-slate-400">Why Trust Us</button>
                <button onclick="showTab('advisors')" id="nav-advisors" class="px-3 py-2 text-[10px] uppercase font-black tracking-widest text-slate-400">Advisors</button>
                <button onclick="showTab('verify')" id="nav-verify" class="px-3 py-2 text-[10px] uppercase font-black tracking-widest text-slate-400">Verification</button>
            </nav>
        </div>
    </header>

    <main id="tab-home" class="animate-fade">
        <section class="hero-bg text-white py-28 px-6 text-center">
            <h2 class="text-4xl md:text-7xl font-black mb-6 italic uppercase leading-tight">Your Journey Starts <br> <span class="text-blue-500 text-3xl md:text-5xl italic">With Trusted Experts</span></h2>
            <button onclick="showTab('verify')" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-5 rounded-full font-black uppercase tracking-widest transition shadow-2xl transform hover:scale-105">Verify My Record</button>
        </section>
    </main>

    <main id="tab-verify" class="hidden container mx-auto px-6 py-16 animate-fade">
        <div class="max-w-4xl mx-auto space-y-8">
            <div class="bg-white p-10 rounded-[3rem] shadow-2xl border-t-[12px] border-blue-600 text-center">
                <h2 class="text-2xl font-black uppercase italic mb-8">Record <span class="text-blue-600">Authentication</span></h2>
                <form onsubmit="handleVerify(event)" class="space-y-4 max-w-lg mx-auto">
                    <input type="text" id="v-name" placeholder="FULL LEGAL NAME" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold uppercase text-xs focus:border-blue-600 outline-none" required>
                    <input type="text" id="v-id" placeholder="FOLIO / ID NUMBER" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold uppercase text-xs focus:border-blue-600 outline-none" required>
                    <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-800 transition shadow-lg">Authenticate Record</button>
                </form>
            </div>
            
            <div id="verify-result" class="hidden bg-white rounded-[2rem] shadow-2xl border-2 border-slate-100 overflow-hidden animate-fade">
                <div class="p-8 flex flex-col lg:flex-row gap-10 items-center lg:items-start">
                    
                    <div class="flex flex-col items-center gap-4">
                        <div class="photo-container relative">
                            <img id="res-img" src="" alt="Document Image">
                        </div>
                        <div class="verify-seal"><i class="fas fa-check-circle"></i> Verified</div>
                    </div>

                    <div class="flex-1 w-full grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                        <div class="md:col-span-2 border-b border-slate-100 pb-2">
                            <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Full Name</p>
                            <p id="res-name" class="text-2xl font-black text-blue-700 uppercase leading-none"></p>
                        </div>
                        
                        <div>
                            <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest">ID / Folio</p>
                            <p id="res-id" class="font-black text-base uppercase text-slate-700"></p>
                        </div>
                        
                        <div>
                            <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest">License Type</p>
                            <p id="res-tipo" class="font-black text-base uppercase text-slate-700"></p>
                        </div>

                        <div class="md:col-span-2">
                            <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Address</p>
                            <p id="res-address" class="font-bold text-sm uppercase text-slate-600"></p>
                        </div>

                        <div class="md:col-span-2">
                            <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Email Contact</p>
                            <p id="res-email" class="font-bold text-sm text-slate-600"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function showTab(id) {
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('tab-active');
                b.classList.add('text-slate-400');
            });
            document.getElementById('nav-' + id).classList.add('tab-active');
            document.getElementById('nav-' + id).classList.remove('text-slate-400');
            window.scrollTo(0,0);
        }

        async function handleVerify(e) {
            e.preventDefault();
            const nInput = document.getElementById('v-name').value;
            const iInput = document.getElementById('v-id').value;
            const resCard = document.getElementById('verify-result');

            try {
                const res = await fetch('/api/verificar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ nombre: nInput, id_cliente: iInput })
                });
                const data = await res.json();
                
                if(data.success) {
                    resCard.classList.remove('hidden');
                    
                    // Asignación de datos (Nombre, ID, Tipo)
                    document.getElementById('res-name').textContent = data.datos.nombre || data.datos.name;
                    document.getElementById('res-id').textContent = data.datos.id_cliente || data.datos.id;
                    document.getElementById('res-tipo').textContent = data.datos.tipo_licencia || "CLASS C OPERATOR";
                    
                    // Asignación de nuevos campos (Dirección y Correo)
                    document.getElementById('res-address').textContent = data.datos.direccion || data.datos.address || "NOT REGISTERED";
                    document.getElementById('res-email').textContent = data.datos.correo || data.datos.email || "N/A";
                    
                    // Foto adaptable
                    const fUrl = data.datos.foto_url || data.datos.photo || data.datos.foto;
                    document.getElementById('res-img').src = fUrl ? fUrl : `https://ui-avatars.com/api/?name=${encodeURIComponent(nInput)}&background=0D8ABC&color=fff&size=512`;
                } else {
                    alert("RECORD NOT FOUND: Please check your credentials.");
                    resCard.classList.add('hidden');
                }
            } catch (err) {
                console.error(err);
                alert("Connection error with the server.");
            }
        }
    </script>
</body>
</html>
